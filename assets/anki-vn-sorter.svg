<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anki VN Sorter</title>
  <desc id="desc">A polished banner for the Anki VN Sorter add-on.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="card" x1="180" y1="72" x2="1020" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="132" y="34" width="936" height="308" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <circle cx="112" cy="64" r="160" fill="#38BDF8" opacity="0.16"/>
  <circle cx="1048" cy="314" r="170" fill="#FDE68A" opacity="0.18"/>
  <circle cx="1020" cy="40" r="92" fill="#F472B6" opacity="0.14"/>

  <g filter="url(#shadow)">
    <rect x="168" y="58" width="864" height="244" rx="34" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.24"/>
  </g>

  <g transform="translate(218 92)">
    <rect x="0" y="0" width="136" height="176" rx="24" fill="#F8FAFC"/>
    <rect x="18" y="22" width="100" height="18" rx="9" fill="#A78BFA"/>
    <rect x="18" y="58" width="70" height="14" rx="7" fill="#67E8F9"/>
    <rect x="18" y="86" width="94" height="14" rx="7" fill="#F9A8D4"/>
    <rect x="18" y="128" width="100" height="26" rx="13" fill="#111827" opacity="0.9"/>
    <text x="68" y="149" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">頻</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="392" y="144" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-1.8">Anki VN Sorter</text>
    <text x="394" y="190" font-size="26" font-weight="600" fill="#CFFAFE">Frequency-first new-card ordering for Japanese sentence decks</text>
    <g transform="translate(394 222)">
      <rect x="0" y="0" width="128" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="64" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Kiku</text>
      <rect x="144" y="0" width="128" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="208" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Lapis</text>
      <rect x="288" y="0" width="176" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="376" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Jiten-powered</text>
    </g>
  </g>
</svg>
